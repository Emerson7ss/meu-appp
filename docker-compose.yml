services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-materiais-app
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: portal-materiais-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge
