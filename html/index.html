<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Materiais</title>
    <meta
      name="description"
      content="Página inicial estática para publicação rápida do projeto."
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0b1020;
        color: #e7ecff;
      }
      main {
        max-width: 640px;
        padding: 24px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      h1 {
        margin-top: 0;
      }
      code {
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Projeto preparado</h1>
      <p>
        A pasta <code>html</code> foi criada com este <code>index.html</code>.
      </p>
      <p>
        Se você quiser publicar a aplicação completa em Next.js, o fluxo correto é:
        <code>npm install</code>, <code>npm run build</code> e
        <code>npm run start</code> em um servidor Node.
      </p>
    </main>
  </body>
</html>
